version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: master
    groups:
      # All five must move together or nothing resolves: PR #3 bumped @fullcalendar/core to
      # 7 on its own and `npm ci` refused it outright, because daygrid 6.1.21 peers on core
      # 6. Listed first so it claims these packages before the type-based groups below, and
      # covering major so a 6 → 7 arrives as one reviewable PR instead of five that each
      # fail alone.
      fullcalendar:
        patterns:
          - "@fullcalendar/*"
        update-types:
          - major
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # FullCalendar 7 is a repackaging, not a bump, and it is not finished. @fullcalendar/
      # timegrid, daygrid, interaction, list and multimonth have no stable 7 — their 7.x
      # line stops at 7.0.0-rc.0 and `latest` is still 6.1.21 — because v7 ships them as
      # subpath entrypoints of @fullcalendar/react, with @fullcalendar/core reduced to a
      # types-only package peering on @full-ui/headless-calendar. Migrating therefore means
      # removing four dependencies and adding a new peer, which Dependabot cannot express:
      # PR #5 bumped react alone and could not be made to pass. v6.1.21 carries no advisory.
      # Delete this block when @fullcalendar/timegrid@7 reaches `latest`, or immediately if
      # a v6 advisory lands. Majors only — 6.1.22 must still arrive, grouped.
      # See agent-os/specs/2026-08-27-0845-fullcalendar-6-pin
      - dependency-name: "@fullcalendar/*"
        update-types: ["version-update:semver-major"]
