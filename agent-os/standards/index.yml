# Agent OS Standards Index

components:
  ux-principles:
    description: Core UI/UX philosophy — outline grid + drawer, inline editing for grid columns, avoid modals, tabs for form sections
  drawer-pattern:
    description: Right-sliding drawer for full-record editing, with server actions and unsaved-changes handling

development:
  testing:
    description: What to test and what not to — pure logic and DB mutations yes (always with a cross-user case), React components no; tests as a tripwire against silent breakage rather than a coverage target
