database:
  migrations:
    description: Generate migrations, never hand-write one without its snapshot; direct connection not the pooler; production migrates during the build; db:push and db:seed are destructive

components:
  ux-principles:
    description: Core UI/UX philosophy — outline grid + drawer, inline editing, no re-sort while editing, date/decimal commit on blur, modals only for confirmations/capture, tabs for form sections
  navigation:
    description: Getting around and finding commands — the grouped sidebar, the ⌘K palette and the ⋯ overflow; one registry for views and one for commands; reserved views render nothing; no command is palette-only, and the complete-palette / short-menu split; shell state is a server-rendered setting, not a localStorage flag
  data-grid:
    description: The one shared DataGrid — hierarchy survives sort/filter/group, drag-to-reorder is first-class, filtering and search reach hidden columns, three rungs of progressive filter disclosure, chips + "Showing N of M", every preference persists through useGridState; and why no grid library
  drawer-pattern:
    description: Right-sliding drawer for full-record editing — DrawerFooter Cancel|Save|Save & Close (or autosave for notes), sticky footer, unsaved-changes on leave, server actions
  modal-pattern:
    description: Build every centered dialog on ModalShell — roles, focus, capture-phase Escape, and choosing whether closing discards or preserves the draft
  responsive:
    description: Adaptive layout below the md breakpoint — list + full-screen sheet instead of grid + drawer, 44px tap targets, the 16px input rule that stops iOS zoom, safe areas and dvh, tap/long-press replacing double-click/right-click, drag disabled on touch

development:
  testing:
    description: What to test and what not to — pure logic and DB mutations yes (always with a cross-user case), React components no; tests as a tripwire against silent breakage rather than a coverage target
  dates:
    description: Calendar day vs instant — UTC noon encoding (fromDateKey/toDateKey/asCalendarDay), localDateKey for wall-clock today, never startOfDay on calendar fields (Aug 1→Jul 31 regression)

product:
  date-model:
    description: The four dates on nodes, one shelving concept (postponed + deferred expiry), inheritance, plan-before-availability CHECK, day-line shelf rule, and state↔date coupling

api:
  response-format:
    description: JSON envelope for HTTP APIs — { ok, data } or { ok, error }
  error-handling:
    description: Stable error codes and HTTP status mapping for API failures
  agent-auth:
    description: Bearer API key auth for agent routes (PLANNER_AGENT_API_KEY)
  agent-tools:
    description: Tool-oriented POST /api/agent/{tool} conventions and design rules
