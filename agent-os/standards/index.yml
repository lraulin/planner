database:
  migrations:
    description: Generate migrations, never hand-write one without its snapshot; direct connection not the pooler; production migrates during the build; db:push and db:seed are destructive

components:
  ux-principles:
    description: Core UI/UX philosophy — outline grid + drawer, inline editing, no re-sort while editing, date/decimal commit on blur, modals only for confirmations/capture, tabs for form sections, icon-only buttons need a title tooltip
  navigation:
    description: Getting around and finding commands — the sidebar, the menu bar as application chrome above the page bar (File leftmost, complete catalog), the icon toolbar as a subset, the Commands panel as the same tree left open, the ⌘K palette plus Go-to extras, and ⋯ as the phone menu bar on the shell; one registry for modules/pages and one for commands; a command without a menu is not shipped except go.*; dual-grid pages name the target (focused shortcut plus Filter for [name]); unavailable is disabled with the specific reason, never absent; declared families fold behind a submenu; right-click covers rows, blank grid space and the calendar; plural verbs act on the on-screen selection reduced to roots
  data-grid:
    description: The one shared DataGrid — hierarchy survives sort/filter/group, drag-to-reorder is first-class, filtering and search reach hidden columns, three rungs of progressive filter disclosure, chips + "Showing N of M", Clear filters is a menu command not a toolbar button, the two-row verbs/lens toolbar (named menus live in the shell), the grid reports its on-screen row ids rather than hosts guessing (via useNavigableIds — sort reorders without shortening, so the two lists look alike), rowMenu takes a nullable row, every preference persists — through useGridState, or through useSetting in the module's own scope where there is no GridToolbar; and why no grid library
  drawer-pattern:
    description: Right-sliding drawer for full-record editing — DrawerFooter Cancel|Save|Save & Close (or autosave for notes), sticky footer, unsaved-changes on leave, server actions
  modal-pattern:
    description: Build every centered dialog on ModalShell — roles, focus, capture-phase Escape, and choosing whether closing discards or preserves the draft
  responsive:
    description: Adaptive layout below the md breakpoint — list + full-screen sheet instead of grid + drawer, 44px tap targets, the 16px input rule that stops iOS zoom, safe areas and dvh, tap/long-press replacing double-click/right-click with the row menu as a real bottom sheet that ignores the press point and drills into submenus, drag disabled on touch

development:
  clean-code:
    description: How code should read here — the app→components→lib→db dependency direction (lib never imports app, components never touch the db, actions.ts stays thin, every mutation takes userId), naming for the concept, small single-purpose lib modules, one shared implementation per concern (DataGrid, ModalShell, Drawer, run()), explicit over clever, no speculative generality, DRY only for business rules, and reviewing agent-written diffs
  security:
    description: Why every mutation takes userId and proves ownership before writing, why the proxy is not the auth gate, why session/dev/agent identities stay separate, what an error is allowed to say, the CSP nonce rules (no nonce in style-src, unsafe-eval only in dev), why HSTS is not ours to set, and when in-memory rate limiting stops being enough
  testing:
    description: What to test and what not to — pure logic and DB mutations yes (always with a cross-user case), React components no; tests as a tripwire against silent breakage rather than a coverage target
  commits:
    description: How to record and retrieve a change for the agent that reads it in six months — specs for governing intent, targeted history for implementation rationale, one logical change per commit, effect-naming subject, useful body, canonical Spec trailer, no AI attribution, and the three immutable-message checks
  dates:
    description: Calendar day vs instant — UTC noon encoding (fromDateKey/toDateKey/asCalendarDay), localDateKey for wall-clock today, never startOfDay on calendar fields (Aug 1→Jul 31 regression), and why the test suite pins TZ

product:
  date-model:
    description: The four dates on nodes, one shelving concept (postponed + deferred expiry), inheritance, plan-before-availability CHECK, day-line shelf rule, and state↔date coupling

api:
  response-format:
    description: JSON envelope for HTTP APIs — { ok, data } or { ok, error }
  error-handling:
    description: Stable error codes and HTTP status mapping for API failures
  agent-auth:
    description: Bearer API key auth for agent routes (PLANNER_AGENT_API_KEY)
  agent-tools:
    description: Agent-oriented tool contracts — canonical registry, intent descriptions, strict schemas, focused discovery, compact outputs, retry safety, and evaluation
